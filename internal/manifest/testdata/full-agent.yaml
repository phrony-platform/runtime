apiVersion: phrony.com/v1
kind: Agent

metadata:
  name: echo-agent
  namespace: demo
  version: 1.2.0
  owner: platform-team
  labels:
    app: echo
    env: test

spec:
  purpose: >
    Accept a short user message and return a structured echo response.
    Read-only. No external side effects.

  instructions:
    ref: prompts/system
    version: 2

  model:
    provider: anthropic
    name: claude-sonnet-4-5
    parameters:
      temperature: 0.2
      max_output_tokens: 500
      stop_sequences: []
    reasoning:
      effort: low
    provider_options: {}

  tools:
    - ref: weather.get-forecast@1.0.0
      side_effect_class: read_only
      description: Look up the weather forecast for a city.
      input_schema:
        inline:
          type: object
          properties:
            city:
              type: string
          required: [city]
    - ref: routing.assign-queue@1.0.0
      side_effect_class: non_idempotent_write

  limits:
    max_tokens_per_run: 5000
    max_loop_iterations: 4
    max_wall_clock_seconds: 30
    on_limit: halt

output:
  format: json
  schema:
    ref: schemas/result
    version: 1
  strict: true
  on_invalid: retry
