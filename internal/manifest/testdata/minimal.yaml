apiVersion: phrony.com/v1
kind: Agent

metadata:
  name: echo-agent
  namespace: demo
  version: 1.2.0

spec:
  purpose: Echo user messages as structured JSON.
  instructions:
    ref: prompts/system
  model:
    provider: anthropic
    name: claude-sonnet-4-5
    parameters:
      temperature: 0.2
      max_output_tokens: 500
  limits:
    max_tokens_per_run: 5000
    max_loop_iterations: 4
    max_wall_clock_seconds: 30
    on_limit: halt

output:
  format: json
  schema:
    ref: schemas/result
  strict: true
  on_invalid: retry
