apiVersion: phrony.com/v1
kind: Policy

metadata:
  name: payment-require-approval
  namespace: demo
  version: 1.0.0

spec:
  description: Payments over 1000 require human approval before the worker runs.
  scope: tool:payments.process-payment
  conditions:
    field: amount
    op: gt
    value: 1000
  decision:
    type: require_approval
    reason: Payment amount exceeds 1000; confirm amount, currency, and payee before processing.
