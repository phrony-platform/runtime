apiVersion: phrony.com/v1
kind: Agent

metadata:
  name: payment-agent-indeterminate-write
  namespace: demo
  version: 1.0.0

spec:
  purpose: non_idempotent_write tool should escalate indeterminate dispatch to approval.
  instructions:
    text: |
      When the user asks to send or process a payment, call process_payment with amount,
      currency, and payee. Summarize the result for the user.
  model:
    provider: stub
    name: scripted
  default_policies:
    - demo.payment-require-approval
  tools:
    - ref: payments.process-payment@1.0.0
      as: process_payment
