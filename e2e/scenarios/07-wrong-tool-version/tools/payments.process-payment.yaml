apiVersion: phrony.com/v1
kind: Tool

metadata:
  name: process-payment
  namespace: payments
  version: 9.9.9

spec:
  description: Process a payment to a payee.
  side_effect_class: non_idempotent_write
  input_schema:
    inline:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
        payee:
          type: string
      required: [amount, currency, payee]
