apiVersion: phrony.com/v1
kind: Agent

metadata:
  name: payment-agent-bad-version
  namespace: demo
  version: 1.0.0

spec:
  purpose: Process user-requested payments via the payment tool.
  instructions:
    text: |
      When the user asks to send or process a payment, call process_payment with amount,
      currency, and payee. Summarize the result for the user.
  model:
    provider: stub
    name: scripted
  default_policies:
    - demo.payment-require-approval
  tools:
    - ref: payments.process-payment@9.9.9
      as: process_payment
