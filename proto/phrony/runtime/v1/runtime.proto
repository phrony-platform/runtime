syntax = "proto3";

package phrony.runtime.v1;

option go_package = "github.com/phrony-platform/runtime/gen/phrony/runtime/v1;runtimev1";

// Runtime is the control plane for the Phrony agent runtime.
service Runtime {
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  rpc RunSession(RunSessionRequest) returns (RunSessionResponse);
  // Bidirectional session stream: client sends start then user_message; server streams
  // session_started, text_delta, awaiting_input, completed, or failed.
  rpc RunSessionInteractive(stream RunSessionInteractiveClientMsg) returns (stream RunSessionInteractiveServerMsg);
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc PublishBundle(PublishBundleRequest) returns (PublishBundleResponse);
  rpc Deploy(DeployRequest) returns (DeployResponse);
  rpc DeployBundle(DeployBundleRequest) returns (DeployBundleResponse);
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  rpc GetActiveVersion(GetActiveVersionRequest) returns (GetActiveVersionResponse);
  rpc GetActiveBundle(GetActiveBundleRequest) returns (GetActiveBundleResponse);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc GetAgentVersion(GetAgentVersionRequest) returns (GetAgentVersionResponse);
  rpc RetireAgentVersion(RetireAgentVersionRequest) returns (RetireAgentVersionResponse);
  rpc CancelSession(CancelSessionRequest) returns (CancelSessionResponse);
  // CompleteSession finalizes an in-progress session as completed, stopping any
  // active driver and keeping the last persisted output.
  rpc CompleteSession(CompleteSessionRequest) returns (CompleteSessionResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ListAgentVersions(ListAgentVersionsRequest) returns (ListAgentVersionsResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetApproval(GetApprovalRequest) returns (Approval);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse);
  rpc DeprecateAgentVersion(DeprecateAgentVersionRequest) returns (DeprecateAgentVersionResponse);
  rpc ArchiveAgent(ArchiveAgentRequest) returns (ArchiveAgentResponse);
  // Reverse worker stream: application workers register tool handlers and receive invocations.
  rpc Work(stream WorkClientMsg) returns (stream WorkServerMsg);
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  string schema_version = 2;
}

// AgentRef identifies an agent. For run/deploy, an empty version resolves the active
// deployment; an explicit version must match the active deployment.
message AgentRef {
  string namespace = 1;
  string name = 2;
  string version = 3;
}

// BundleRef identifies a published bundle. version is the lockfile hash (sha256:…).
// For run/deploy, an empty version resolves the active bundle deployment.
message BundleRef {
  string namespace = 1;
  string name = 2;
  string version = 3;
}

message RunSessionRequest {
  AgentRef agent_ref = 1;
  // JSON object with session inputs (opaque to the runtime until execution).
  bytes input = 2;
  // Resolved secret values keyed by secrets.<name>. Required for every manifest
  // secret when starting a session. Never logged or stored in manifest JSONB.
  map<string, bytes> resolved_secrets = 3;
  // When set, runs the bundle root member from the deployed bundle closure.
  BundleRef bundle_ref = 4;
}

message RunSessionResponse {
  string session_id = 1;
  string agent_version_id = 2;
  // running: session is executing the first turn in the background (detached RunSession).
  string status = 3;
}

message RunSessionInteractiveClientMsg {
  oneof body {
    RunSessionInteractiveStart start = 1;
    RunSessionInteractiveUserMessage user_message = 2;
    RunSessionInteractiveToolApproval tool_approval = 3;
  }
}

message RunSessionInteractiveStart {
  // When set without session_id, starts a background session (same as RunSession) and
  // attaches this stream as the first subscriber. input uses RunSessionRequest semantics.
  AgentRef agent_ref = 1;
  bytes input = 2;
  // When set, attach to an existing session; agent_ref, input, and resolved_secrets are ignored.
  string session_id = 3;
  // Resolved secret values for a new session (same semantics as RunSessionRequest).
  map<string, bytes> resolved_secrets = 4;
  // When set, runs the bundle root member from the deployed bundle closure.
  BundleRef bundle_ref = 5;
}

message RunSessionInteractiveUserMessage {
  string text = 1;
}

message RunSessionInteractiveServerMsg {
  oneof body {
    RunSessionInteractiveSessionStarted session_started = 1;
    RunSessionInteractiveTextDelta text_delta = 2;
    RunSessionInteractiveAwaitingInput awaiting_input = 3;
    RunSessionInteractiveCompleted completed = 4;
    RunSessionInteractiveFailed failed = 5;
    RunSessionInteractiveToolCall tool_call = 6;
    RunSessionInteractiveToolResult tool_result = 7;
    RunSessionInteractiveApprovalRequired approval_required = 8;
    RunSessionInteractiveCancelled cancelled = 9;
  }
}

message InteractiveConversationMessage {
  string role = 1;
  string content = 2;
  // Set on assistant messages for completed turns (restored when re-attaching).
  string stop_reason = 3;
  TokenUsage turn_usage = 4;
  // Wall-clock latency for the completed turn, in milliseconds.
  int64 turn_duration_ms = 5;
}

message RunSessionInteractiveSessionStarted {
  string session_id = 1;
  string agent_version_id = 2;
  string model_provider = 3;
  string model_name = 4;
  // Prior turns when attaching to an existing session; empty for new sessions.
  repeated InteractiveConversationMessage history = 5;
  // Agent manifest limits.max_tokens_per_run when set; 0 when unlimited.
  int32 max_tokens_per_run = 6;
  // Agent manifest limits.max_wall_clock_seconds when set; 0 when unlimited.
  int32 max_wall_clock_seconds = 7;
  // Wall-clock anchor for the run (session created_at when attaching, stream start for new sessions).
  int64 session_started_at_unix_ms = 8;
  // When set, the run has ended; clients should freeze wall-clock display at this time (session updated_at on attach).
  int64 session_ended_at_unix_ms = 9;
  // Descriptive metadata from the deployed agent (labels, annotations, governance, framework packs).
  DescriptiveMetadataEvidence descriptive_metadata = 10;
}

// DescriptiveMetadataEvidence is the session evidence snapshot (inert at evaluation).
message DescriptiveMetadataEvidence {
  string owner = 1;
  map<string, string> labels = 2;
  map<string, string> annotations = 3;
  GovernanceMetadataEvidence governance = 4;
}

message GovernanceMetadataEvidence {
  string risk_tier = 1;
  repeated string classifications = 2;
  repeated string authority_boundaries = 3;
  repeated FrameworkPackEvidence frameworks = 4;
}

message FrameworkPackEvidence {
  string id = 1;
  // validated or unvalidated (unknown packs are always unvalidated).
  string validation = 2;
  bytes payload = 3;
}

message RunSessionInteractiveTextDelta {
  string delta = 1;
}

message TokenUsage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 total_tokens = 3;
  // True when counts are heuristic estimates rather than provider-reported usage.
  bool estimated = 4;
}

message InteractiveSessionStats {
  int32 turn = 1;
  TokenUsage turn_usage = 2;
  TokenUsage session_usage = 3;
}

message RunSessionInteractiveAwaitingInput {
  string stop_reason = 1;
  InteractiveSessionStats stats = 2;
  // When set, the session stays attached but the client must not send user_message.
  string input_blocked_reason = 3;
}

message RunSessionInteractiveCompleted {
  string stop_reason = 1;
  // JSON object with the final session output for this run.
  bytes output = 2;
  InteractiveSessionStats stats = 3;
  // Wall-clock time when the run ended (for freezing elapsed display in clients).
  int64 session_ended_at_unix_ms = 4;
}

message RunSessionInteractiveFailed {
  string message = 1;
}

message RunSessionInteractiveCancelled {
  // Wall-clock time when the run was cancelled (for freezing elapsed display in clients).
  int64 session_ended_at_unix_ms = 1;
}

message RunSessionInteractiveToolCall {
  string call_id = 1;
  string tool = 2;
  string version = 3;
  bytes args = 4;
}

message RunSessionInteractiveToolResult {
  string call_id = 1;
  bytes payload = 2;
  string error_message = 3;
}

message RunSessionInteractiveApprovalRequired {
  string approval_id = 1;
  string call_id = 2;
  string tool = 3;
  string version = 4;
  bytes args = 5;
  string route = 6;
  string reason = 7;
  string authority_ref = 8;
  string policy_name = 9;
  // JSON object: policy decision.runtime passthrough.
  bytes policy_runtime = 10;
  int32 approvals_required = 11;
  int32 approvals_received = 12;
  bool comprehension_required = 13;
  // RFC3339; empty when no timeout is configured.
  string expires_at = 14;
}

message RunSessionInteractiveToolApproval {
  string approval_id = 1;
  bool approved = 2;
  string comment = 3;
  // When set, replaces proposed tool arguments before dispatch (subject to on_modify: revalidate).
  bytes args = 4;
}

message PublishRequest {
  bytes manifest = 1;
  // Audit actor; when empty the server uses PHRONY_ACTOR or the OS user.
  string actor = 2;
}

message PublishResponse {
  string agent_id = 1;
  string version_id = 2;
  string content_hash = 3;
  string namespace = 4;
  string name = 5;
  string version = 6;
}

message BundleMemberPackage {
  string child_name = 1;
  // vendored or external
  string origin = 2;
  // Bundle-relative path or namespace/name@version pin from authoring.
  string authoring_ref = 3;
  bytes resolved_manifest = 4;
  bool is_root = 5;
  // Set for external members: existing published agent_version id.
  string member_version_id = 6;
}

message PublishBundleRequest {
  bytes bundle_manifest = 1;
  repeated BundleMemberPackage members = 2;
  // Audit actor; when empty the server uses PHRONY_ACTOR or the OS user.
  string actor = 3;
  // Canonical bundle.lock.json body committed beside the bundle manifest.
  bytes committed_lock = 4;
}

message PublishBundleResponse {
  string bundle_id = 1;
  string bundle_version_id = 2;
  string lock_hash = 3;
  string namespace = 4;
  string name = 5;
  // Canonical lockfile JSON emitted at publish.
  bytes lock = 6;
}

message DeployRequest {
  AgentRef agent_ref = 1;
  // Audit actor; when empty the server uses PHRONY_ACTOR or the OS user.
  string actor = 2;
}

message DeployResponse {
  string namespace = 1;
  string name = 2;
  string version = 3;
  // Version that was active before this deployment; empty on first deploy.
  string previous_version = 4;
  string deployed_at = 5;  // RFC3339
}

message DeployBundleRequest {
  BundleRef bundle_ref = 1;
  // Audit actor; when empty the server uses PHRONY_ACTOR or the OS user.
  string actor = 2;
}

message DeployBundleResponse {
  string namespace = 1;
  string name = 2;
  // Lockfile hash of the deployed bundle version.
  string version = 3;
  // Lock hash that was active before this deployment; empty on first deploy.
  string previous_version = 4;
  string deployed_at = 5;  // RFC3339
}

message RollbackRequest {
  AgentRef agent_ref = 1;
  // Target version; when empty, rolls back to the previous active version.
  string to_version = 2;
  string actor = 3;
}

message RollbackResponse {
  string version = 1;
  string previous_version = 2;
}

message GetActiveVersionRequest {
  AgentRef agent_ref = 1;
}

message GetActiveVersionResponse {
  string version = 1;
  string deployed_at = 2;  // RFC3339
  string actor = 3;
}

message GetActiveBundleRequest {
  BundleRef bundle_ref = 1;
}

message GetActiveBundleResponse {
  // Lockfile hash of the active bundle deployment.
  string version = 1;
  string deployed_at = 2;  // RFC3339
  string actor = 3;
}

message ListDeploymentsRequest {
  AgentRef agent_ref = 1;
}

message DeploymentEntry {
  string version = 1;
  string action = 2;
  string actor = 3;
  string created_at = 4;  // RFC3339
}

message ListDeploymentsResponse {
  repeated DeploymentEntry deployments = 1;
}

message GetAgentVersionRequest {
  AgentRef agent_ref = 1;
}

message GetAgentVersionResponse {
  bytes manifest = 1;
  string content_hash = 2;
  string version = 3;
  string published_at = 4;   // RFC3339
  string deprecated_at = 5;  // RFC3339, empty when active
  string retired_at = 6;     // RFC3339, empty when not retired
}

message RetireAgentVersionRequest {
  AgentRef agent_ref = 1;
}

message RetireAgentVersionResponse {
  string version_id = 1;
}

message CancelSessionRequest {
  string session_id = 1;
}

message CancelSessionResponse {}

message CompleteSessionRequest {
  string session_id = 1;
}

message CompleteSessionResponse {}

message ListAgentsRequest {
  // When set, only agents in this namespace are returned.
  string namespace = 1;
}

message AgentSummary {
  string id = 1;
  string namespace = 2;
  string name = 3;
  string owner = 4;
  // RFC3339 timestamp when archived; empty when active.
  string archived_at = 5;
}

message ListAgentsResponse {
  repeated AgentSummary agents = 1;
}

message ListAgentVersionsRequest {
  AgentRef agent_ref = 1;
}

message AgentVersionSummary {
  string id = 1;
  string version = 2;
  string content_hash = 3;
  string deployed_at = 4;
  // RFC3339 timestamp when deprecated; empty when runnable.
  string deprecated_at = 5;
  // RFC3339 timestamp when retired; empty when not retired.
  string retired_at = 6;
}

message ListAgentVersionsResponse {
  repeated AgentVersionSummary versions = 1;
}

message ListSessionsRequest {
  AgentRef agent_ref = 1;
  // Optional filter; empty means all statuses.
  string status = 2;
}

message SessionSummary {
  string id = 1;
  string agent_version_id = 2;
  string status = 3;
  string created_at = 4;  // RFC3339
  string updated_at = 5;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message ApprovalVote {
  string decided_by = 1;
  // approved or denied
  string decision = 2;
  string comment = 3;
  bool comprehension_acknowledged = 4;
  string created_at = 5; // RFC3339
}

message Approval {
  string id = 1;
  string session_id = 2;
  string call_id = 3;
  string status = 4;
  string route = 5;
  string reason = 6;
  string tool = 7;
  string version = 8;
  bytes args = 9;
  string authority_ref = 10;
  string policy_name = 11;
  // JSON object: policy decision.runtime passthrough.
  bytes policy_runtime = 12;
  int32 approvals_required = 13;
  int32 approvals_received = 14;
  bool comprehension_required = 15;
  string on_reject = 16;
  string on_modify = 17;
  // RFC3339; empty when no timeout is configured.
  string expires_at = 18;
  string created_at = 19; // RFC3339
  string decided_at = 20; // RFC3339
  string decided_by = 21;
  string comment = 22;
  repeated ApprovalVote votes = 23;
}

message GetApprovalRequest {
  string approval_id = 1;
}

message ListApprovalsRequest {
  // Optional filter; empty means all statuses.
  string status = 1;
  string route = 2;
  string session_id = 3;
  string agent_namespace = 4;
  string agent_name = 5;
}

message ListApprovalsResponse {
  repeated Approval approvals = 1;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_APPROVE = 1;
  APPROVAL_DECISION_REJECT = 2;
}

message DecideApprovalRequest {
  string approval_id = 1;
  ApprovalDecision decision = 2;
  string comment = 3;
  // When set on approve, replaces proposed tool arguments before dispatch.
  bytes args = 4;
  bool comprehension_acknowledged = 5;
  // Audit actor; when empty the server uses PHRONY_ACTOR or the OS user.
  string actor = 6;
}

message DecideApprovalResponse {
  // pending, approved, denied, or escalated
  string status = 1;
  int32 approvals_received = 2;
  string session_status = 3;
}

message DeprecateAgentVersionRequest {
  AgentRef agent_ref = 1;
}

message DeprecateAgentVersionResponse {
  string version_id = 1;
}

message ArchiveAgentRequest {
  AgentRef agent_ref = 1;
}

message ArchiveAgentResponse {}

// Work is the bidirectional reverse stream between the runtime and an application worker.

message WorkClientMsg {
  oneof body {
    WorkRegister register = 1;
    WorkHeartbeat heartbeat = 2;
    WorkToolResult result = 3;
    WorkToolNack nack = 4;
  }
}

message WorkServerMsg {
  oneof body {
    WorkRegistered registered = 1;
    WorkInvoke invoke = 2;
    WorkToolCancel cancel = 3;
    WorkResultAck result_ack = 4;
    WorkHeartbeatAck heartbeat_ack = 5;
  }
}

message WorkHandlerAdvertisement {
  string tool = 1;
  string version = 2;
  string contract_version = 3;
  // Maximum concurrent invocations this worker accepts for tool@version (0 = 1).
  uint32 max_concurrency = 4;
  // Descriptor hash of the handler contract (audit only; not an enforcement gate).
  string descriptor_hash = 5;
}

message WorkInFlightCall {
  string call_id = 1;
}

message WorkRegister {
  string worker_id = 1;
  string workload_identity = 2;
  string image_digest = 3;
  repeated WorkHandlerAdvertisement handlers = 4;
  // Calls still executing or holding a result awaiting runtime ack (reconnect resync).
  repeated WorkInFlightCall in_flight = 5;
}

message WorkRegistered {
  string worker_id = 1;
  // Worker should send heartbeats before this lease expires.
  int64 lease_ttl_ms = 2;
}

message WorkHeartbeat {}

message WorkHeartbeatAck {}

message WorkInvoke {
  string call_id = 1;
  string session_id = 2;
  string agent_version_id = 3;
  int32 turn = 4;
  string tool = 5;
  string version = 6;
  bytes args = 7;
  string side_effect_class = 8;
  int64 deadline_unix_ms = 9;
}

message WorkToolCancel {
  string call_id = 1;
}

message WorkToolResult {
  string call_id = 1;
  bytes payload = 2;
  WorkToolError error = 3;
}

message WorkToolNack {
  string call_id = 1;
  string code = 2;
  string message = 3;
}

message WorkToolError {
  string code = 1;
  string message = 2;
}

message WorkResultAck {
  string call_id = 1;
}
