syntax = "proto3";

package phrony.runtime.v1;

option go_package = "github.com/phrony-platform/runtime/gen/phrony/runtime/v1;runtimev1";

// Runtime is the control plane for the Phrony agent runtime.
service Runtime {
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  rpc RunSession(RunSessionRequest) returns (RunSessionResponse);
  rpc Deploy(DeployRequest) returns (DeployResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ListAgentVersions(ListAgentVersionsRequest) returns (ListAgentVersionsResponse);
  rpc DeprecateAgentVersion(DeprecateAgentVersionRequest) returns (DeprecateAgentVersionResponse);
  rpc ArchiveAgent(ArchiveAgentRequest) returns (ArchiveAgentResponse);
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  string schema_version = 2;
}

// AgentRef identifies a deployed agent. When version is empty, the latest
// deployed semver for that agent is used.
message AgentRef {
  string namespace = 1;
  string name = 2;
  string version = 3;
}

message RunSessionRequest {
  AgentRef agent_ref = 1;
  // JSON object with session inputs (opaque to the runtime until execution).
  bytes input = 2;
}

message RunSessionResponse {
  string session_id = 1;
  string agent_version_id = 2;
  // pending: session created and bound; model execution is not available yet.
  string status = 3;
}

message DeployRequest {
  bytes manifest = 1;
}

message DeployResponse {
  string agent_id = 1;
  string version_id = 2;
  string content_hash = 3;
  string namespace = 4;
  string name = 5;
  string version = 6;
}

message ListAgentsRequest {
  // When set, only agents in this namespace are returned.
  string namespace = 1;
}

message AgentSummary {
  string id = 1;
  string namespace = 2;
  string name = 3;
  string owner = 4;
  // RFC3339 timestamp when archived; empty when active.
  string archived_at = 5;
}

message ListAgentsResponse {
  repeated AgentSummary agents = 1;
}

message ListAgentVersionsRequest {
  AgentRef agent_ref = 1;
}

message AgentVersionSummary {
  string id = 1;
  string version = 2;
  string content_hash = 3;
  string deployed_at = 4;
  // RFC3339 timestamp when deprecated; empty when runnable.
  string deprecated_at = 5;
}

message ListAgentVersionsResponse {
  repeated AgentVersionSummary versions = 1;
}

message DeprecateAgentVersionRequest {
  AgentRef agent_ref = 1;
}

message DeprecateAgentVersionResponse {
  string version_id = 1;
}

message ArchiveAgentRequest {
  AgentRef agent_ref = 1;
}

message ArchiveAgentResponse {}
